    state_interfaces:
      - position

    gains:
      torso_lift_joint: {p: 0.0, i: 0.0, d: 0.0}

    interpolate_from_desired_state: true

    constraints:
      goal_time: 0.6
      stopped_velocity_tolerance: 5.0
      torso_lift_joint: {goal: 0.02}


