controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_left_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    torso_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    arm_right_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_left_controller:
  ros__parameters:
    joints:
      - arm_left_1_joint
      - arm_left_2_joint
      - arm_left_3_joint
      - arm_left_4_joint
      - arm_left_5_joint
      - arm_left_6_joint
      - arm_left_7_joint
    command_interfaces:
      - position
    state_interfaces:
      - position

    gains:
      arm_left_1_joint: {p: 0.0, i: 0.0, d: 0.0}
      arm_left_2_joint: {p: 0.0, i: 0.0, d: 0.0}
      arm_left_3_joint: {p: 0.0, i: 0.0, d: 0.0}
      arm_left_4_joint: {p: 0.0, i: 0.0, d: 0.0}
      arm_left_5_joint: {p: 0.0, i: 0.0, d: 0.0}
      arm_left_6_joint: {p: 0.0, i: 0.0, d: 0.0}
      arm_left_7_joint: {p: 0.0, i: 0.0, d: 0.0}

    interpolate_from_desired_state: true

    constraints:
      goal_time: 0.6
      stopped_velocity_tolerance: 5.0
      arm_left_1_joint: {goal: 0.02}
      arm_left_2_joint: {goal: 0.02}
      arm_left_3_joint: {goal: 0.02}
      arm_left_4_joint: {goal: 0.02}
      arm_left_5_joint: {goal: 0.02}
      arm_left_6_joint: {goal: 0.02}
      arm_left_7_joint: {goal: 0.02}


torso_controller:
  ros__parameters:
    joints:
      - torso_lift_joint
    command_interfaces:
