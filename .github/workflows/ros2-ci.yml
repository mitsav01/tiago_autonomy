name: ROS 2 Jazzy CI

on:
  push:
    branches:
      - jazzy
  pull_request:
    branches:
      - jazzy
  workflow_dispatch:
    inputs:
      run_full_sim:
        description: "Run Stage 3 Full Gazebo Simulation Integration"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ros2-jazzy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-latest

    container:
      image: rostooling/setup-ros-docker:ubuntu-jazzy-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install formatters
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-pip \
            ros-jazzy-xacro \
            ros-jazzy-ament-clang-format
          python3 -m pip install \
            --break-system-packages \
            black
          rm -rf /var/lib/apt/lists/*

      - name: Check Python and C/C++ formatting
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .github/tools/format_code.sh
          ./.github/tools/format_code.sh --check

  build-and-test:
    name: Build, Test & Application Validation
    needs: format-check
    runs-on: ubuntu-latest

    container:
      image: rostooling/setup-ros-docker:ubuntu-jazzy-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install additional dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ros-jazzy-xacro \
            ros-jazzy-ros2run \
            ros-jazzy-ros2cli \
            python3-psutil \
            python3-yaml \
            python3-numpy \
            python3-pytest
          rm -rf /var/lib/apt/lists/*

      - name: Build and test ROS 2 packages
        id: ros_ci
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: >
            tiago_autonomy_bringup
            tiago_navigation
            tiago_field_tools
          target-ros2-distro: jazzy
          vcs-repo-file-url: .github/dependencies.repos
          coverage-result: false

      # =========================================================================
      # STAGE 1: Unit & Configuration Schema Tests
      # =========================================================================
      - name: Stage 1 - Unit & Metrics Calculation Tests
        shell: bash
        run: |
          set -euo pipefail
          WS_DIR="${{ steps.ros_ci.outputs.ros-workspace-directory-name }}"

          set +u
          [ -f "/opt/ros/jazzy/setup.bash" ] && . "/opt/ros/jazzy/setup.bash"
          [ -f "${WS_DIR}/install/setup.bash" ] && . "${WS_DIR}/install/setup.bash"
          set -u

          python3 -m pytest -v "${WS_DIR}/src"/*/tiago_field_tools/tests || \
          python3 -m pytest -v --pyargs tiago_field_tools || true

      # =========================================================================
      # STAGE 2: Health Audit on Raw Graph (Verifies Failure Detection)
      # =========================================================================
      - name: Stage 2 - Pre-Flight Health Audit Validation
        shell: bash
        run: |
          set -uo pipefail
          WS_DIR="${{ steps.ros_ci.outputs.ros-workspace-directory-name }}"

          set +u
          if [ -f "/opt/ros/jazzy/setup.bash" ]; then
            . "/opt/ros/jazzy/setup.bash"
          elif [ -f "/opt/ros/jazzy/setup.sh" ]; then
            . "/opt/ros/jazzy/setup.sh"
          else
            echo "ERROR: /opt/ros/jazzy setup script not found. Contents of /opt/ros:"
            ls -la /opt/ros || true
            exit 1
          fi

          if [ -f "${WS_DIR}/install/setup.bash" ]; then
            . "${WS_DIR}/install/setup.bash"
          elif [ -f "${WS_DIR}/install/setup.sh" ]; then
            . "${WS_DIR}/install/setup.sh"
          fi
          set -u

          mkdir -p /tmp/tiago_validation_results

          echo "Verifying health_monitor catches missing nodes cleanly..."
          EXIT_CODE=0

          if ros2 --help 2>&1 | grep -qw "run"; then
            # Preferred entrypoint execution (omitting .py extension)
            ros2 run tiago_field_tools health_monitor --json > /tmp/tiago_validation_results/preflight_empty.json 2>&1 || EXIT_CODE=$?
          else
            # Module execution fallback if ros2run entry points fail to bind
            python3 -m tiago_field_tools.health_monitor --json > /tmp/tiago_validation_results/preflight_empty.json 2>&1 || EXIT_CODE=$?
          fi

          if [ "$EXIT_CODE" -ne 1 ]; then
            echo "Health monitor failed to catch missing nodes (expected code 1, got $EXIT_CODE)"
            cat /tmp/tiago_validation_results/preflight_empty.json
            exit 1
          fi

          if ! grep -q '"status": "NOT_READY"' /tmp/tiago_validation_results/preflight_empty.json; then
            echo "Expected '\"status\": \"NOT_READY\"' in output, but got:"
            cat /tmp/tiago_validation_results/preflight_empty.json
            exit 1
          fi

          echo "Health monitor verified: correctly flagged NOT_READY on idle graph."

      # =========================================================================
      # STAGE 3: Simulation Integration Suite (Manual Dispatch or Specific Triggers)
      # =========================================================================
      - name: Stage 3 - Simulation Integration Trials
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_sim == true }}
        shell: bash
        run: |
          set -uo pipefail
          WS_DIR="${{ steps.ros_ci.outputs.ros-workspace-directory-name }}"

          set +u
          [ -f "/opt/ros/jazzy/setup.bash" ] && . "/opt/ros/jazzy/setup.bash"
          [ -f "${WS_DIR}/install/setup.bash" ] && . "${WS_DIR}/install/setup.bash"
          set -u

          echo "Running headless validation suite..."
          ros2 run tiago_field_tools test_runner --ros-args -p use_sim_time:=true || \
          python3 -m tiago_field_tools.test_runner --ros-args -p use_sim_time:=true || true

      # =========================================================================
      # STAGE 4: Aggregate Metrics & Archive SAT Report
      # =========================================================================
      - name: Stage 4 - Aggregate Metrics & Generate SAT Report
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          WS_DIR="${{ steps.ros_ci.outputs.ros-workspace-directory-name }}"

          set +u
          [ -f "/opt/ros/jazzy/setup.bash" ] && . "/opt/ros/jazzy/setup.bash"
          [ -f "${WS_DIR}/install/setup.bash" ] && . "${WS_DIR}/install/setup.bash"
          set -u

          mkdir -p /tmp/tiago_validation_results

          # Run metric collector and report generator (using module fallback if needed)
          (ros2 run tiago_field_tools metrics_collector 2>/dev/null || python3 -m tiago_field_tools.metrics_collector 2>/dev/null) || true
          (ros2 run tiago_field_tools report_generator 2>/dev/null || python3 -m tiago_field_tools.report_generator 2>/dev/null) || true

          if [ -f /tmp/tiago_validation_results/acceptance_report.md ]; then
            cat /tmp/tiago_validation_results/acceptance_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload SAT Report & Metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiago-sat-validation-report-${{ github.run_id }}
          path: |
            /tmp/tiago_validation_results/acceptance_report.md
            /tmp/tiago_validation_results/aggregated_metrics.json
            /tmp/tiago_validation_results/metrics.csv
            /tmp/tiago_validation_results/raw_trials.jsonl
            /tmp/tiago_validation_results/preflight_empty.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload colcon logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-logs-${{ github.run_id }}
          path: ${{ steps.ros_ci.outputs.ros-workspace-directory-name }}/log
          if-no-files-found: ignore
          retention-days: 14